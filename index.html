<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Питер · Маршрут</title>
<style>
  :root{
    --sky-deep: #0b1f33;
    --sky-mid: #16324f;
    --neva: #3d7ea6;
    --gold: #c9a86a;
    --gold-bright: #e8cd93;
    --paper: #eef2f5;
    --paper-dim: #b8c4cf;
    --card: #12283f;
    --card-border: rgba(201,168,106,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--sky-deep); color:var(--paper); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; overflow-x:hidden;}

  @font-face{
    font-family:'PetersburgDisplay';
    src:local('Georgia');
  }

  .display{
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 0.01em;
  }

  .hero{
    position:relative;
    padding: 34px 20px 26px;
    background:
      radial-gradient(120% 90% at 50% -10%, #24466b 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-mid) 100%);
    border-bottom: 1px solid var(--card-border);
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:70px;
    background: linear-gradient(180deg, transparent, rgba(61,126,166,0.18));
    pointer-events:none;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color: var(--gold); font-weight:600; margin:0 0 8px;
  }
  h1.display{
    margin:0; font-size: 30px; line-height:1.15; color: var(--paper);
    font-weight:400;
  }
  h1.display em{ color: var(--gold-bright); font-style:normal; }
  .sub{
    margin:10px 0 0; font-size:14px; color: var(--paper-dim); line-height:1.5;
    max-width: 46ch;
  }

  .tabs{
    display:flex; gap:8px; padding: 14px 16px; overflow-x:auto;
    background: var(--sky-mid); border-bottom:1px solid var(--card-border);
    scrollbar-width:none; position:sticky; top:0; z-index:5;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:9px 14px; border-radius:999px;
    border:1px solid var(--card-border); background: rgba(255,255,255,0.03);
    color: var(--paper-dim); font-size:13px; font-weight:600;
    white-space:nowrap; cursor:pointer; transition: all .2s ease;
  }
  .tab .d{ display:block; font-size:10px; font-weight:500; opacity:.75; margin-top:1px;}
  .tab.active{
    background: linear-gradient(135deg, var(--gold) 0%, #a9824f 100%);
    color: #241a0c; border-color: transparent;
  }

  main{ padding: 22px 16px 60px; max-width:560px; margin:0 auto; }

  .day-panel{ display:none; }
  .day-panel.active{ display:block; animation: fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .day-title{ font-size:13px; color:var(--gold); text-transform:uppercase; letter-spacing:.12em; font-weight:700; margin: 4px 0 4px;}
  .day-narrative{ font-size:14px; color:var(--paper-dim); margin: 0 0 22px; line-height:1.5; }

  .timeline{ position:relative; padding-left: 26px; }
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px; width:2px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--neva) 100%);
    border-radius:2px;
  }

  .stop{ position:relative; margin-bottom:22px; }
  .stop::before{
    content:""; position:absolute; left:-25px; top:5px;
    width:11px; height:11px; border-radius:50%;
    background: var(--sky-deep); border:2px solid var(--gold-bright);
  }
  .stop.food::before{ background: var(--gold-bright); border-color: var(--gold-bright); }

  .time{ font-size:12px; color:var(--gold-bright); font-weight:700; letter-spacing:.04em; }
  .card{
    margin-top:6px; background: var(--card); border:1px solid var(--card-border);
    border-radius:14px; padding:14px 16px;
  }
  .name{ font-size:17px; margin:0 0 4px; color:var(--paper); font-weight:600; }
  .name.display{ font-family: Georgia, serif; font-weight:400; font-size:19px;}
  .note{ font-size:13.5px; color:var(--paper-dim); line-height:1.45; margin:0 0 12px; }
  .tag{
    display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
    padding:3px 8px; border-radius:6px; margin-bottom:8px; font-weight:700;
  }
  .tag.food{ background: rgba(201,168,106,0.18); color: var(--gold-bright); }
  .tag.sight{ background: rgba(61,126,166,0.22); color: #9fd0ea; }

  .maps-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; color: var(--sky-deep);
    background: var(--gold-bright); padding:8px 14px; border-radius:999px;
    text-decoration:none; transition: transform .15s ease;
  }
  .maps-btn:active{ transform: scale(0.96); }
  .maps-btn svg{ width:13px; height:13px; }

  .actions{ display:flex; flex-wrap:wrap; gap:8px; }
  .book-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; color: var(--gold-bright);
    background: transparent; border:1px solid var(--gold);
    padding:7px 14px; border-radius:999px; text-decoration:none;
    transition: transform .15s ease;
  }
  .book-btn:active{ transform: scale(0.96); }
  .book-btn svg{ width:13px; height:13px; }

  footer{
    text-align:center; padding: 18px 20px 40px; color: var(--paper-dim);
    font-size:12px; line-height:1.6;
  }
  footer .line{ width:40px; height:1px; background:var(--card-border); margin: 18px auto; }
</style>
</head>
<body>

<div class="hero">
  <p class="eyebrow">Санкт-Петербург · 31.07 — 03.08</p>
  <h1 class="display">Трип по <em>Питеру</em></h1>
  <p class="sub">Гуляем, смотрим, вкусно едим. Первая кнопка — карта, вторая — билеты и бронь столика.</p>
</div>

<div class="tabs" id="tabs"></div>

<main id="days"></main>

<footer>
  Всего 4 дня в городе на Неве.
  <div class="line"></div>
  Маршрут собран так, чтобы не спешить.
</footer>

<script>
const DATA = [
  {
    date: "31 июля", label: "Заезд", weekday: "Чт",
    narrative: "Утром приезжаем, днём заселяемся. Вечер — без музеев и очередей: вода, воздух и закат над заливом.",
    stops: [
      { time: "18:30", name: "Севкабель Порт", note: "Пешеходная набережная прямо на Финский залив. Бывший завод, теперь гастро-квартал: кофейни, бары, столики у воды.", type:"sight", lat:59.9269, lng:30.2394 },
      { time: "19:30", name: "Ужин у воды в Севкабеле", note: "Ужинаем прямо на набережной. Заранее ничего бронировать не надо — точек много, выбираем на месте по настроению.", type:"food", lat:59.9271, lng:30.2402 },
      { time: "21:20", name: "Закат над заливом", note: "Солнце садится в 21:28. Остаёмся на набережной — лучший вид на закат в городе, и никуда не надо идти.", type:"sight", lat:59.9265, lng:30.2381 },
    ]
  },
  {
    date: "1 августа", label: "Соборы", weekday: "Пт",
    narrative: "День соборов. Три главных храма города подряд, все в пешей доступности друг от друга.",
    stops: [
      { time: "10:00", name: "Спас на Крови", note: "Открывается в 10:00, среда — выходной. Внутри почти восемь тысяч квадратных метров мозаики, стены и потолок целиком. Идём с утра, пока нет толпы.", type:"sight", lat:59.9401, lng:30.3289, link:{url:"https://www.cathedral.ru/ru", label:"Билеты"} },
      { time: "11:30", name: "Казанский собор", note: "Семь минут пешком по каналу Грибоедова. Вход свободный, билет не нужен — это действующий храм, а не музей.", type:"sight", lat:59.9343, lng:30.3246 },
      { time: "13:00", name: "Мансарда", note: "Обед на высоте, панорамные окна прямо на купол Исаакия. Столик бронируем заранее.", type:"food", lat:59.93279, lng:30.30379, link:{url:"https://www.restoclub.ru/spb/place/mansarda", label:"Забронировать"} },
      { time: "14:30", name: "Исаакиевский собор", note: "Собор и колоннада — билеты отдельные, берём оба. На колоннаду 262 ступени и весь город с высоты.", type:"sight", lat:59.933905, lng:30.306485, link:{url:"https://www.cathedral.ru/ru", label:"Билеты"} },
      { time: "17:00", name: "Передышка в отеле", note: "После четырёх точек и лестницы — заслуженная пауза. Заодно закрыть дела по работе. Ночью не спим, так что отдохнуть стоит всерьёз.", type:"sight", lat:59.949534, lng:30.301732 },
      { time: "19:30", name: "Банщики", note: "Ужин: русская кухня, одна из лучших в городе.", type:"food", lat:59.930385, lng:30.369997, link:{url:"https://www.restoclub.ru/spb/place/banshhiki", label:"Забронировать"} },
      { time: "00:30", name: "Развод мостов с воды", note: "То самое. Посадка в 23:59 на Дворцовой набережной, отход в 00:30, Дворцовый мост разводят в 01:10. С воды это совсем не то, что из толпы на набережной. Билет берём заранее, места разбирают.", type:"sight", lat:59.9437, lng:30.3193, link:{url:"https://nevatrip.ru/night/nochnaya-ekskursiya-pod-razvod-mostov", label:"Билеты на теплоход"} },
    ]
  },
  {
    date: "2 августа", label: "Звери", weekday: "Сб",
    narrative: "После ночных мостов спим до упора. Дальше крепость, лемуры и акулы — первые две точки соседи, между ними пешком через парк.",
    stops: [
      { time: "11:45", name: "Петропавловская крепость", note: "Приходим до полудня: ровно в 12:00 с Нарышкина бастиона стреляет пушка, традиции больше двухсот лет. Дальше гуляем вдоль Невы, отсюда лучшая панорама центра.", type:"sight", lat:59.950002, lng:30.316672 },
      { time: "13:30", name: "Ленинградский зоопарк", note: "Лемуры здесь: кошачьи и вари, у них отдельный новый вольер. Пять минут пешком от крепости через Александровский парк. Билет 800 ₽.", type:"sight", lat:59.9553, lng:30.3117, link:{url:"http://www.spbzoo.ru/", label:"Билеты"} },
      { time: "15:30", name: "Il Milanese", note: "Обед: уютная итальянская кухня, для разнообразия после русской. Столик занимаем по телефону, онлайн-брони у них нет.", type:"food", lat:59.9464221, lng:30.3484652 },
      { time: "18:00", name: "Океанариум с акулами", note: "Тоннель с акулами над головой. В 19:00 показательное кормление — ради него и приходим заранее, чтобы занять место у стекла.", type:"sight", lat:59.9189375, lng:30.3387071, link:{url:"https://planeta-neptun.ru/ocean/", label:"Билеты"} },
    ]
  },
  {
    date: "3 августа", label: "Отъезд", weekday: "Вс",
    narrative: "Эрмитаж на десерт, прощальный обед и домой. Вещи с утра оставляем в отеле, по городу не таскаем.",
    stops: [
      { time: "11:00", name: "Эрмитаж", note: "Берём первый сеанс, билет покупаем заранее на сайте — летом в кассу стоят по часу. Обойти всё нереально: идём по Зимнему дворцу, парадные залы и Рембрандт.", type:"sight", lat:59.9398, lng:30.3146, link:{url:"https://tickets.hermitagemuseum.org", label:"Билеты"} },
      { time: "13:15", name: "Дворцовая площадь", note: "Выходим из музея прямо на неё. Александровская колонна ничем не закреплена — стоит на собственном весе.", type:"sight", lat:59.939832, lng:30.31456 },
      { time: "13:45", name: "Birch", note: "Прощальный обед. Мест мало, бронь открывается за 30 дней и разбирается быстро — занимаем сильно заранее.", type:"food", lat:59.943848, lng:30.350799, link:{url:"https://birchrestaurants.com/saintpetersburg", label:"Забронировать"} },
      { time: "15:30", name: "Сборы, отъезд в 17:00", note: "Забираем вещи из отеля. Запас времени на дорогу до вокзала или аэропорта.", type:"sight", lat:59.9401, lng:30.3289 },
    ]
  },
];

const tabsEl = document.getElementById('tabs');
const daysEl = document.getElementById('days');

const IS_APPLE = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function mapsUrl(lat, lng, name){
  const q = encodeURIComponent(name);
  if (IS_APPLE) return `https://maps.apple.com/?q=${q}&ll=${lat},${lng}`;
  return `https://yandex.ru/maps/?ll=${lng},${lat}&z=17&pt=${lng},${lat},pm2rdm&text=${q}`;
}

function mapsLabel(){
  return IS_APPLE ? 'Открыть в Картах' : 'Открыть в Яндекс.Картах';
}

DATA.forEach((day, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (i===0 ? ' active' : '');
  tab.innerHTML = `${day.label}<span class="d">${day.weekday}, ${day.date}</span>`;
  tab.onclick = () => selectDay(i);
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'day-panel' + (i===0 ? ' active' : '');
  panel.id = 'panel-' + i;

  let stopsHtml = '';
  day.stops.forEach(s => {
    stopsHtml += `
      <div class="stop ${s.type === 'food' ? 'food' : ''}">
        <div class="time">${s.time}</div>
        <div class="card">
          <span class="tag ${s.type}">${s.type === 'food' ? 'Еда' : 'Место'}</span>
          <p class="name display">${s.name}</p>
          <p class="note">${s.note}</p>
          <div class="actions">
            <a class="maps-btn" href="${mapsUrl(s.lat, s.lng, s.name)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s-7-6.5-7-11.5A7 7 0 0 1 12 2a7 7 0 0 1 7 7.5C19 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
              ${mapsLabel()}
            </a>
            ${s.link ? `<a class="book-btn" href="${s.link.url}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 3h7v7"/><path d="M21 3l-9 9"/><path d="M19 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/></svg>
              ${s.link.label}
            </a>` : ''}
          </div>
        </div>
      </div>`;
  });

  panel.innerHTML = `
    <p class="day-title">${day.weekday}, ${day.date}</p>
    <p class="day-narrative">${day.narrative}</p>
    <div class="timeline">${stopsHtml}</div>
  `;
  daysEl.appendChild(panel);
});

function selectDay(i){
  document.querySelectorAll('.tab').forEach((t,idx)=> t.classList.toggle('active', idx===i));
  document.querySelectorAll('.day-panel').forEach((p,idx)=> p.classList.toggle('active', idx===i));
  document.getElementById('panel-'+i).scrollIntoView({behavior:'smooth', block:'start'});
}
</script>

</body>
</html>
