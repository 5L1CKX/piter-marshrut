<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Питер · Маршрут</title>
<style>
  :root{
    --sky-deep: #0b1f33;
    --sky-mid: #16324f;
    --neva: #3d7ea6;
    --gold: #c9a86a;
    --gold-bright: #e8cd93;
    --paper: #eef2f5;
    --paper-dim: #b8c4cf;
    --card: #12283f;
    --card-border: rgba(201,168,106,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--sky-deep); color:var(--paper); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; overflow-x:hidden;}

  @font-face{
    font-family:'PetersburgDisplay';
    src:local('Georgia');
  }

  .display{
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 0.01em;
  }

  .hero{
    position:relative;
    padding: 34px 20px 26px;
    background:
      radial-gradient(120% 90% at 50% -10%, #24466b 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-mid) 100%);
    border-bottom: 1px solid var(--card-border);
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:70px;
    background: linear-gradient(180deg, transparent, rgba(61,126,166,0.18));
    pointer-events:none;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color: var(--gold); font-weight:600; margin:0 0 8px;
  }
  h1.display{
    margin:0; font-size: 30px; line-height:1.15; color: var(--paper);
    font-weight:400;
  }
  h1.display em{ color: var(--gold-bright); font-style:normal; }
  .sub{
    margin:10px 0 0; font-size:14px; color: var(--paper-dim); line-height:1.5;
    max-width: 46ch;
  }

  .tabs{
    display:flex; gap:8px; padding: 14px 16px; overflow-x:auto;
    background: var(--sky-mid); border-bottom:1px solid var(--card-border);
    scrollbar-width:none; position:sticky; top:0; z-index:5;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:9px 14px; border-radius:999px;
    border:1px solid var(--card-border); background: rgba(255,255,255,0.03);
    color: var(--paper-dim); font-size:13px; font-weight:600;
    white-space:nowrap; cursor:pointer; transition: all .2s ease;
  }
  .tab .d{ display:block; font-size:10px; font-weight:500; opacity:.75; margin-top:1px;}
  .tab.active{
    background: linear-gradient(135deg, var(--gold) 0%, #a9824f 100%);
    color: #241a0c; border-color: transparent;
  }

  main{ padding: 22px 16px 60px; max-width:560px; margin:0 auto; }

  .day-panel{ display:none; }
  .day-panel.active{ display:block; animation: fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .day-title{ font-size:13px; color:var(--gold); text-transform:uppercase; letter-spacing:.12em; font-weight:700; margin: 4px 0 4px;}
  .day-narrative{ font-size:14px; color:var(--paper-dim); margin: 0 0 22px; line-height:1.5; }

  .timeline{ position:relative; padding-left: 26px; }
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px; width:2px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--neva) 100%);
    border-radius:2px;
  }

  .stop{ position:relative; margin-bottom:22px; }
  .stop::before{
    content:""; position:absolute; left:-25px; top:5px;
    width:11px; height:11px; border-radius:50%;
    background: var(--sky-deep); border:2px solid var(--gold-bright);
  }
  .stop.food::before{ background: var(--gold-bright); border-color: var(--gold-bright); }

  .time{ font-size:12px; color:var(--gold-bright); font-weight:700; letter-spacing:.04em; }
  .card{
    margin-top:6px; background: var(--card); border:1px solid var(--card-border);
    border-radius:14px; padding:14px 16px;
  }
  .name{ font-size:17px; margin:0 0 4px; color:var(--paper); font-weight:600; }
  .name.display{ font-family: Georgia, serif; font-weight:400; font-size:19px;}
  .note{ font-size:13.5px; color:var(--paper-dim); line-height:1.45; margin:0 0 12px; }
  .tag{
    display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
    padding:3px 8px; border-radius:6px; margin-bottom:8px; font-weight:700;
  }
  .tag.food{ background: rgba(201,168,106,0.18); color: var(--gold-bright); }
  .tag.sight{ background: rgba(61,126,166,0.22); color: #9fd0ea; }

  .maps-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; color: var(--sky-deep);
    background: var(--gold-bright); padding:8px 14px; border-radius:999px;
    text-decoration:none; transition: transform .15s ease;
  }
  .maps-btn:active{ transform: scale(0.96); }
  .maps-btn svg{ width:13px; height:13px; }

  footer{
    text-align:center; padding: 18px 20px 40px; color: var(--paper-dim);
    font-size:12px; line-height:1.6;
  }
  footer .line{ width:40px; height:1px; background:var(--card-border); margin: 18px auto; }
</style>
</head>
<body>

<div class="hero">
  <p class="eyebrow">Санкт-Петербург · 31.07 — 03.08</p>
  <h1 class="display">Маршрут для <em>Эдика</em></h1>
  <p class="sub">Гулять, смотреть, вкусно есть. Жми на точку — откроется в Картах на телефоне.</p>
</div>

<div class="tabs" id="tabs"></div>

<main id="days"></main>

<footer>
  Всего 4 дня в городе на Неве.
  <div class="line"></div>
  Маршрут собран так, чтобы не спешить.
</footer>

<script>
const DATA = [
  {
    date: "31 июля", label: "Заезд", weekday: "Чт",
    narrative: "Утром приезжаете, днём заселение — на прогулки остаётся только вечер. Не перегружаем.",
    stops: [
      { time: "17:30", name: "Спас на Крови", note: "Самое яркое место города, лёгкая размяка после заезда.", type:"sight", lat:59.9401, lng:30.3289 },
      { time: "19:00", name: "Brisket", note: "Ужин: стейки и бургеры, в 10 минутах от Спаса.", type:"food", lat:59.939007, lng:30.325482 },
    ]
  },
  {
    date: "1 августа", label: "Центр", weekday: "Пт",
    narrative: "Полный день по главным видам центра — соборы, площадь, набережные.",
    stops: [
      { time: "10:30", name: "Исаакиевский собор", note: "Колоннада с видом на весь город — маст-си.", type:"sight", lat:59.933905, lng:30.306485 },
      { time: "12:00", name: "Дворцовая площадь", note: "10 минут пешком от Исаакия, рядом фасад Эрмитажа.", type:"sight", lat:59.939832, lng:30.31456 },
      { time: "13:30", name: "Мансарда", note: "Обед с видом на Исаакий сверху — бронируйте заранее.", type:"food", lat:59.93279, lng:30.30379 },
      { time: "16:00", name: "Свободное время", note: "Отдых после насыщенного утра, связь по работе — можно в отеле.", type:"sight", lat:59.949534, lng:30.301732 },
      { time: "19:00", name: "Банщики", note: "Ужин: топовая аутентичная русская кухня.", type:"food", lat:59.930385, lng:30.369997 },
    ]
  },
  {
    date: "2 августа", label: "Крепость", weekday: "Сб",
    narrative: "Утро — Петропавловка и Нева, вечером — акулы.",
    stops: [
      { time: "11:00", name: "Петропавловская крепость", note: "Гуляем вдоль Невы, отличные виды на город.", type:"sight", lat:59.950002, lng:30.316672 },
      { time: "13:30", name: "Il Milanese", note: "Уютный итальянский, для разнообразия.", type:"food", lat:59.9464221, lng:30.3484652 },
      { time: "17:00", name: "Океанариум с акулами", note: "Вход 700₽. Тоннель с акулами над головой — приезжайте заранее, чтобы занять места.", type:"sight", lat:59.9189375, lng:30.3387071 },
    ]
  },
  {
    date: "3 августа", label: "Отъезд", weekday: "Вс",
    narrative: "Последний день — лёгкая прогулка и обед, отъезд в 17:00.",
    stops: [
      { time: "10:00", name: "Дворцовая площадь", note: "Прощальная прогулка, можно докупить сувениры.", type:"sight", lat:59.938942, lng:30.314987 },
      { time: "12:30", name: "Birch", note: "Прощальный обед — бронь заранее.", type:"food", lat:59.943848, lng:30.350799 },
      { time: "14:30", name: "Сборы, отъезд в 17:00", note: "Запас времени на дорогу до вокзала / аэропорта.", type:"sight", lat:59.9401, lng:30.3289 },
    ]
  },
];

const tabsEl = document.getElementById('tabs');
const daysEl = document.getElementById('days');

function mapsUrl(lat, lng, name){
  const q = encodeURIComponent(name);
  return `https://maps.apple.com/?q=${q}&ll=${lat},${lng}`;
}

DATA.forEach((day, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (i===0 ? ' active' : '');
  tab.innerHTML = `${day.label}<span class="d">${day.weekday}, ${day.date}</span>`;
  tab.onclick = () => selectDay(i);
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'day-panel' + (i===0 ? ' active' : '');
  panel.id = 'panel-' + i;

  let stopsHtml = '';
  day.stops.forEach(s => {
    stopsHtml += `
      <div class="stop ${s.type === 'food' ? 'food' : ''}">
        <div class="time">${s.time}</div>
        <div class="card">
          <span class="tag ${s.type}">${s.type === 'food' ? 'Еда' : 'Место'}</span>
          <p class="name display">${s.name}</p>
          <p class="note">${s.note}</p>
          <a class="maps-btn" href="${mapsUrl(s.lat, s.lng, s.name)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s-7-6.5-7-11.5A7 7 0 0 1 12 2a7 7 0 0 1 7 7.5C19 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
            Открыть в Картах
          </a>
        </div>
      </div>`;
  });

  panel.innerHTML = `
    <p class="day-title">${day.weekday}, ${day.date}</p>
    <p class="day-narrative">${day.narrative}</p>
    <div class="timeline">${stopsHtml}</div>
  `;
  daysEl.appendChild(panel);
});

function selectDay(i){
  document.querySelectorAll('.tab').forEach((t,idx)=> t.classList.toggle('active', idx===i));
  document.querySelectorAll('.day-panel').forEach((p,idx)=> p.classList.toggle('active', idx===i));
  document.getElementById('panel-'+i).scrollIntoView({behavior:'smooth', block:'start'});
}
</script>

</body>
</html>
